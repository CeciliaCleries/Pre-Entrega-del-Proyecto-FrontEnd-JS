<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!--css externo-->
    <link rel="stylesheet" href="../css/styles.css">
    <title>Contacto</title>
</head>
<body>
    <header>
        <div class="div-logo"><a class="logo" href="../index.html"><img src="../img/Esoterismo Claudia.png" alt="logo Claudia Esoterica"></a>
        </div>
        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Inicio</a>
                </li>
                <li><a href="./contacto.html">Contacto</a>
                </li>
                 <li><a href="./carrito.html">🛒<span id="contador-carrito"></span></a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="inicio">
            <h1>Contactame</h1>
        </section>
        <form action="./result.html" method="get" target="blanck"></form>
        <div class="formulario">
        <label for="nombre">Nombre:</label>
        <input 
        type="text" 
        id="nombre" 
        name="nombre" 
        placeholder="Ingrese su nombre..."
        required
        />
        <label for="email">Correo electrónico:</label>
        <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="Ingrese su correo electrónico..."
        required
        />
        </div>
        <div class="formulario">
        <label for="motivo">Motivo:</label>
        <select id="motivo" name="motivo" required>
        <option value="">Seleccione un motivo</option>
        <option value="Tarot">Tarot</option>
        <option value="Numerología">Numerología</option>
        <option value="Angeología">Angeología</option>
        <option value="Meditación">Meditación</option>
        <option value="Músico y Arteterapia Holistico">Músico y Arteterapia Holistico</option>
        <option value="Limpieza Enérgetica">Limpieza Enérgetica</option>
        <option value="Procesos Álmicos">Procesos Álmicos</option>
    </select>
    <label for="mensaje">Mensaje:</label>
    <textarea 
    id="mensaje" 
    name="mensaje" 
    rows="4"
    cols="30"
    placeholder="Ingrese aquí su mensaje..."></textarea>
    </div>
    <div>
        <button type="submit" class="btn">Enviar</button>
        <button type="reset" class="btn">Borrar</button>
    </div>
    </main>
    <footer>
    <nav>
        <ul class="footer-list">
            <li><a href="https://www.facebook.com/claudiaesoterica"><img src="../img/facebook logo.png"alt="facebook logo"></a></li>
            <li><a href="https://www.youtube.com/@ClaudiaEsoterica119" ><img src="../img/youtube logo.png" alt="youtube logo"></a></li>
            <li><a href="https://www.instagram.com/claudia_esoterica/"><img src="../img/instagram logo.png" alt="instagram logo"></a></li>
            <li><a href="https://www.tiktok.com/@claudiaesoterica?lang=es"><img src="../img/tiktok logo.png" alt="tiktok logo"></a></li>
        </ul>   
    </nav>        
    </footer>
    <script src="../js/contacto.js" type="module"></script>
</body>
</html>
